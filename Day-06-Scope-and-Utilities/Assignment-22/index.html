<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Utility Library</title>
</head>
<body>
    
    <h1>Validation Utility Library</h1>

    <script src="validationUtils.js"></script>

    <script>

        console.log(validateName("Aarna"));

        console.log(validatePassword("123"));

        console.log(validateMarks(120));
