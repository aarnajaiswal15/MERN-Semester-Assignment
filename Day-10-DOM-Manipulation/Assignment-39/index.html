<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="profile-card">

        <h1>Student Profile</h1>

        <p id="name">Name: Aarna Jaiswal</p>
        <p id="course">Course: BCA AI</p>
        <p id="semester">Semester: 3</p>

        <p id="status" aria-live="polite">
            Profile is inactive
        </p>

        <button id="toggleButton" aria-pressed="false">
            Activate Profile
        </button>

        <button id="detailsButton">
            Show Details
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
