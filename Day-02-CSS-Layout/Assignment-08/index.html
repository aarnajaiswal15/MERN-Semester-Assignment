<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product-card">
            <h2>Headphones</h2>
            <p>High quality wireless headphones.</p>
            <h3>₹1,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <h2>Smart Watch</h2>
            <p>Stylish smartwatch with useful features.</p>
            <h3>₹2,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <h2>Keyboard</h2>
            <p>Comfortable keyboard for daily use.</p>
            <h3>₹999</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <h2>Mouse</h2>
            <p>Wireless mouse with smooth control.</p>
            <h3>₹599</h3>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
