<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="dashboard">

        <aside class="sidebar">
            <h2>MyDashboard</h2>

            <ul>
                <li>Home</li>
                <li>Analytics</li>
                <li>Projects</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="main-content">

            <header>
                <h1>Dashboard</h1>
                <p>Welcome back, Aarna!</p>
            </header>

            <section class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <h2>250</h2>
                </div>

                <div class="card">
                    <h3>Courses</h3>
                    <h2>12</h2>
                </div>

                <div class="card">
                    <h3>Assignments</h3>
                    <h2>35</h2>
                </div>

            </section>

            <section class="activity">
                <h2>Recent Activity</h2>
                <p>Completed HTML Assignment</p>
                <p>Started CSS Grid Practice</p>
                <p>Submitted Project Report</p>
            </section>

        </main>

    </div>

</body>
</html>
