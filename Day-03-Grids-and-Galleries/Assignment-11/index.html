<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
            <h2>Smart Watch</h2>
            <p>₹2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400" alt="Mouse">
            <h2>Wireless Mouse</h2>
            <p>₹699</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400" alt="Smartwatch">
            <h2>Fitness Band</h2>
            <p>₹1,299</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1503602642458-232111445657?w=400" alt="Chair">
            <h2>Study Chair</h2>
            <p>₹3,499</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
