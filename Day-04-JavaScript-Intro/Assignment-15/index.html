<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>
    
    <h1>Student Profile</h1>

    <script>
        // String variables
        let studentName = "Aarna Jaiswal";
        let course = "BCA AI";

        // Number variables
        let age = 19;
        let semester = 3;

        // Boolean variable
        let isEnrolled = true;

        // Array variable
        let subjects = ["JavaScript", "Python", "DSA"];

        // Object variable
        let student = {
            name: studentName,
            course: course,
            age: age
        };

        // Display student information
        console.log("Student Name:", studentName);
        console.log("Course:", course);
        console.log("Age:", age);
        console.log("Semester:", semester);
        console.log("Currently Enrolled:", isEnrolled);
        console.log("Subjects:", subjects);
        console.log("Student Details:", student);
    </script>

</body>
</html>
